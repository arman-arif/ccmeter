<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ccmeter</title>
<style>
  .viz-root {
    color-scheme: light;
    --surface-0: #f3f2ef;
    --surface-1: #fcfcfb;
    --border: #e2e1dc;
    --grid: #ecebe7;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #7c7b76;
    --series-1: #2a78d6;
    --track: #e7e6e1;
    --warn-ink: #8a5a00;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) .viz-root {
      color-scheme: dark;
      --surface-0: #121211;
      --surface-1: #1a1a19;
      --border: #2c2c2a;
      --grid: #262624;
      --text-primary: #f0efec;
      --text-secondary: #c3c2b7;
      --text-muted: #8e8d86;
      --series-1: #3987e5;
      --track: #2c2c2a;
      --warn-ink: #e5b24a;
    }
  }
  :root[data-theme="dark"] .viz-root {
    color-scheme: dark;
    --surface-0: #121211;
    --surface-1: #1a1a19;
    --border: #2c2c2a;
    --grid: #262624;
    --text-primary: #f0efec;
    --text-secondary: #c3c2b7;
    --text-muted: #8e8d86;
    --series-1: #3987e5;
    --track: #2c2c2a;
    --warn-ink: #e5b24a;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body.viz-root {
    background: var(--surface-0);
    color: var(--text-primary);
    font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
  }
  .icon { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none;
          stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -3px; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 24px 20px 48px; }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0; display: flex; align-items: center; gap: 8px; }
  header h1 .icon { width: 20px; height: 20px; color: var(--series-1); }
  .spacer { flex: 1; }
  .status { color: var(--text-muted); font-size: 12px; display: flex; align-items: center; gap: 6px; }
  .btn { background: var(--surface-1); color: var(--text-secondary); border: 1px solid var(--border);
         border-radius: 8px; height: 32px; padding: 0 10px; display: inline-flex; align-items: center;
         gap: 6px; cursor: pointer; font: inherit; font-size: 13px; }
  .btn:hover { color: var(--text-primary); }

  .totals { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
  .tile { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
  .tile .label { color: var(--text-secondary); font-size: 12px; }
  .tile .value { font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .tile .sub { color: var(--text-muted); font-size: 12px; font-variant-numeric: tabular-nums; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 16px; }
  .card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
  .card-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 2px; }
  .card-head h2 { font-size: 16px; margin: 0; }
  .dir { color: var(--text-muted); font-size: 12px; display: flex; align-items: center; gap: 5px;
         margin-bottom: 14px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .dir .icon { width: 13px; height: 13px; }

  .block { border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 14px; }
  .block-top { display: flex; align-items: baseline; gap: 8px; }
  .block-top .k { color: var(--text-secondary); font-size: 12px; }
  .block-top .v { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .block-top .right { margin-left: auto; color: var(--text-secondary); font-size: 12px;
                      display: flex; align-items: center; gap: 5px; }
  .bar { height: 8px; background: var(--track); border-radius: 4px; margin: 10px 0 8px; overflow: hidden; position: relative; }
  .bar > span { position: absolute; inset: 0 auto 0 0; background: var(--series-1); border-radius: 4px; }
  .bar > i { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--text-muted); opacity: .6; }
  .block-meta { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--text-muted); font-size: 12px;
                font-variant-numeric: tabular-nums; }
  .warn { color: var(--warn-ink); display: inline-flex; align-items: center; gap: 4px; font-weight: 500; }
  .idle { color: var(--text-muted); font-size: 13px; display: flex; align-items: center; gap: 6px; }

  .periods { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
  .periods .k { color: var(--text-secondary); font-size: 12px; }
  .periods .v { font-weight: 600; font-variant-numeric: tabular-nums; }
  .periods .s { color: var(--text-muted); font-size: 12px; font-variant-numeric: tabular-nums; }

  .chart-title { color: var(--text-secondary); font-size: 12px; margin-bottom: 4px; }
  .chart { position: relative; }
  .chart svg { display: block; width: 100%; height: 120px; overflow: visible; }
  .chart .axis { fill: var(--text-muted); font-size: 10px; }
  .chart .gridline { stroke: var(--grid); stroke-width: 1; }
  .chart .baseline { stroke: var(--border); stroke-width: 1; }
  .chart .bar-mark { fill: var(--series-1); }
  .chart .hit { fill: transparent; cursor: default; }
  .chart .hit:hover + .bar-mark, .chart .bar-mark.on { opacity: .75; }
  .tip { position: absolute; pointer-events: none; background: var(--surface-1); color: var(--text-primary);
         border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px; font-size: 12px;
         box-shadow: 0 4px 14px rgba(0,0,0,.12); white-space: nowrap; transform: translate(-50%, -100%);
         font-variant-numeric: tabular-nums; display: none; z-index: 2; }
  .tip b { font-weight: 600; }
  .tip .muted { color: var(--text-secondary); }

  details { margin-top: 12px; }
  summary { cursor: pointer; color: var(--text-secondary); font-size: 12px; list-style: none;
            display: flex; align-items: center; gap: 5px; }
  summary::-webkit-details-marker { display: none; }
  summary .icon { width: 13px; height: 13px; transition: transform .15s; }
  details[open] summary .icon { transform: rotate(90deg); }
  table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 12px; font-variant-numeric: tabular-nums; }
  th { text-align: right; color: var(--text-secondary); font-weight: 500; padding: 4px 6px; border-bottom: 1px solid var(--border); }
  td { text-align: right; padding: 4px 6px; border-bottom: 1px solid var(--grid); }
  th:first-child, td:first-child { text-align: left; }
  td.model { max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .note { margin-top: 10px; color: var(--warn-ink); font-size: 12px; display: flex; gap: 6px; align-items: flex-start; }
  .empty { background: var(--surface-1); border: 1px dashed var(--border); border-radius: 12px; padding: 28px;
           color: var(--text-secondary); text-align: center; }
  code { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--surface-0);
         padding: 1px 5px; border-radius: 4px; }
  footer { margin-top: 24px; color: var(--text-muted); font-size: 12px; }
  @media (max-width: 640px) { .totals { grid-template-columns: 1fr; } .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body class="viz-root">

<!-- Icon sprite: every icon in the UI is an SVG <use> of one of these symbols. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-gauge" viewBox="0 0 24 24"><path d="M12 14l4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4"/><path d="M12 17h.01"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M10 9v6"/><path d="M14 9v6"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
  <symbol id="i-trend" viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></symbol>
</svg>

<div class="wrap">
  <header>
    <h1><svg class="icon"><use href="#i-gauge"/></svg>Claude Code usage</h1>
    <div class="spacer"></div>
    <span class="status" id="status"><svg class="icon"><use href="#i-refresh"/></svg><span>loading</span></span>
    <button class="btn" id="refresh" type="button" aria-label="Refresh now"><svg class="icon"><use href="#i-refresh"/></svg></button>
    <button class="btn" id="theme" type="button" aria-label="Toggle theme"><svg class="icon"><use id="theme-icon" href="#i-moon"/></svg></button>
  </header>

  <section class="totals" id="totals"></section>
  <section class="grid" id="accounts"></section>

  <footer>
    Costs are estimates at API list prices, read from each config dir's <code>projects/*.jsonl</code> logs.
    The 5-hour percentage is against <code>block_limit_usd</code> when set, otherwise against your own busiest window in the last 30 days.
  </footer>
</div>

<div class="tip" id="tip"></div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const icon = (id, cls = '') => `<svg class="icon ${cls}" aria-hidden="true"><use href="#i-${id}"/></svg>`;
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function tok(n) {
  if (n >= 1e9) return (n / 1e9).toFixed(2) + 'B';
  if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
  if (n >= 1e3) return (n / 1e3).toFixed(1) + 'k';
  return String(n);
}
const usd = v => '$' + (v >= 100 ? v.toFixed(0) : v.toFixed(2));
const dur = m => m < 60 ? m + 'm' : Math.floor(m / 60) + 'h ' + String(m % 60).padStart(2, '0') + 'm';
const hhmm = t => new Date(t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
function ago(t) {
  const s = (Date.now() - new Date(t)) / 1000;
  if (s < 90) return 'just now';
  if (s < 3600) return Math.round(s / 60) + 'm ago';
  if (s < 86400) return Math.round(s / 3600) + 'h ago';
  return Math.round(s / 86400) + 'd ago';
}

// ---- theme toggle -------------------------------------------------------
function currentTheme() {
  const set = document.documentElement.dataset.theme;
  if (set) return set;
  return matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  $('#theme-icon').setAttribute('href', t === 'dark' ? '#i-sun' : '#i-moon');
  try { localStorage.setItem('ccmeter-theme', t); } catch (e) {}
}
try { const t = localStorage.getItem('ccmeter-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
$('#theme-icon').setAttribute('href', currentTheme() === 'dark' ? '#i-sun' : '#i-moon');
$('#theme').onclick = () => applyTheme(currentTheme() === 'dark' ? 'light' : 'dark');

// ---- rendering ----------------------------------------------------------
function tile(label, t) {
  return `<div class="tile"><div class="label">${label}</div>
    <div class="value">${usd(t.cost_usd)}</div>
    <div class="sub">${tok(t.tokens)} tokens · ${t.messages.toLocaleString()} responses</div></div>`;
}

function blockHTML(b) {
  if (!b.active) {
    return `<div class="block"><div class="idle">${icon('pause')}No active 5-hour window</div></div>`;
  }
  const pct = b.limit_usd > 0 ? b.pct : null;
  const fill = pct == null ? 0 : Math.min(pct, 100);
  const proj = b.limit_usd > 0 ? Math.min(100 * b.projected_usd / b.limit_usd, 100) : null;
  const limitLabel = b.limit_source === 'config' ? 'of limit' : 'of your 30-day peak';
  const near = pct != null && pct >= 80;
  return `<div class="block">
    <div class="block-top">
      <span class="v">${usd(b.cost_usd)}</span>
      <span class="k">${pct != null ? Math.round(pct) + '% ' + limitLabel : '5-hour window'}</span>
      <span class="right">${icon('clock')}${dur(b.remaining_min)} left · resets ${hhmm(b.end)}</span>
    </div>
    ${pct != null ? `<div class="bar" role="progressbar" aria-valuenow="${Math.round(fill)}" aria-valuemin="0" aria-valuemax="100">
      <span style="width:${fill}%"></span>${proj != null && proj > fill ? `<i style="left:calc(${proj}% - 1px)" title="Projected at current pace"></i>` : ''}</div>` : '<div style="height:8px"></div>'}
    <div class="block-meta">
      <span>${tok(b.tokens)} tokens</span>
      <span>${icon('trend')} ${usd(b.burn_usd_per_hour)}/h</span>
      <span>projected ${usd(b.projected_usd)}</span>
      <span>started ${hhmm(b.start)}</span>
      ${near ? `<span class="warn">${icon('alert')}Near limit</span>` : ''}
    </div>
  </div>`;
}

function period(label, p) {
  const extra = p.limit_usd ? ` · ${Math.round(p.pct)}%` : '';
  return `<div><div class="k">${label}</div><div class="v">${usd(p.cost_usd)}</div>
    <div class="s">${tok(p.tokens)}${extra}</div></div>`;
}

// Daily cost bars: one series, thin marks, rounded data-end at the top,
// anchored to the baseline, 2px gap between bars, hover tooltip.
function chartHTML(daily, idx) {
  const W = 340, H = 120, padL = 34, padB = 18, padT = 6;
  const n = daily.length, iw = W - padL, ih = H - padB - padT;
  const max = Math.max(...daily.map(d => d.cost_usd), 0);
  const top = niceMax(max);
  const slot = iw / n, bw = Math.max(slot - 2, 1);
  let g = '';
  for (const f of [0.5, 1]) {
    const y = padT + ih - ih * f;
    g += `<line class="gridline" x1="${padL}" x2="${W}" y1="${y}" y2="${y}"/>
          <text class="axis" x="${padL - 6}" y="${y + 3}" text-anchor="end">${usd(top * f)}</text>`;
  }
  let bars = '';
  daily.forEach((d, i) => {
    const h = top > 0 ? ih * d.cost_usd / top : 0;
    const x = padL + i * slot + 1, y = padT + ih - h;
    const r = Math.min(4, bw / 2, h);
    const path = h <= 0 ? '' :
      `M${x},${padT + ih}V${y + r}Q${x},${y} ${x + r},${y}H${x + bw - r}Q${x + bw},${y} ${x + bw},${y + r}V${padT + ih}Z`;
    bars += `<rect class="hit" x="${padL + i * slot}" y="${padT}" width="${slot}" height="${ih}" data-a="${idx}" data-i="${i}"/>`
          + (path ? `<path class="bar-mark" d="${path}"/>` : '<path class="bar-mark" d=""/>');
  });
  const first = daily[0]?.date.slice(5), last = daily[n - 1]?.date.slice(5);
  return `<div class="chart-title">Daily cost, last 30 days</div>
    <div class="chart"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Daily cost, last 30 days">
      ${g}<line class="baseline" x1="${padL}" x2="${W}" y1="${padT + ih}" y2="${padT + ih}"/>
      ${bars}
      <text class="axis" x="${padL}" y="${H - 4}">${first}</text>
      <text class="axis" x="${W}" y="${H - 4}" text-anchor="end">${last}</text>
    </svg></div>`;
}
function niceMax(v) {
  if (v <= 0) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  for (const m of [1, 2, 2.5, 5, 10]) if (m * p >= v) return m * p;
  return 10 * p;
}

function modelsTable(models) {
  if (!models?.length) return '';
  return `<details><summary>${icon('chevron')}Models, last 30 days</summary><table>
    <tr><th>Model</th><th>Input</th><th>Output</th><th>Cache W</th><th>Cache R</th><th>Cost</th></tr>
    ${models.map(m => `<tr><td class="model" title="${esc(m.model)}">${esc(m.model)}</td><td>${tok(m.input)}</td>
      <td>${tok(m.output)}</td><td>${tok(m.cache_write)}</td><td>${tok(m.cache_read)}</td>
      <td>${m.priced ? usd(m.cost_usd) : 'unpriced'}</td></tr>`).join('')}
  </table></details>`;
}
function dailyTable(daily) {
  const rows = daily.filter(d => d.tokens > 0).reverse();
  if (!rows.length) return '';
  return `<details><summary>${icon('chevron')}Daily table</summary><table>
    <tr><th>Date</th><th>Tokens</th><th>Cost</th></tr>
    ${rows.map(d => `<tr><td>${d.date}</td><td>${tok(d.tokens)}</td><td>${usd(d.cost_usd)}</td></tr>`).join('')}
  </table></details>`;
}

function cardHTML(a, idx) {
  if (!a.found) {
    return `<article class="card"><div class="card-head"><h2>${esc(a.name)}</h2></div>
      <div class="dir">${icon('folder')}${esc(a.dir)}</div>
      <div class="note">${icon('alert')}<span>No <code>projects/</code> folder found in this config dir.</span></div></article>`;
  }
  return `<article class="card">
    <div class="card-head"><h2>${esc(a.name)}</h2>
      <span class="status">${a.last_activity ? 'active ' + ago(a.last_activity) : 'no recent activity'}</span></div>
    <div class="dir" title="${esc(a.dir)}">${icon('folder')}${esc(a.dir)}</div>
    ${blockHTML(a.block)}
    <div class="periods">${period('Today', a.today)}${period('7 days', a.week)}${period('30 days', a.month)}</div>
    ${chartHTML(a.daily, idx)}
    ${dailyTable(a.daily)}
    ${modelsTable(a.models)}
    ${a.unpriced?.length ? `<div class="note">${icon('alert')}<span>Unpriced models: ${a.unpriced.map(esc).join(', ')}. Add them under <code>pricing</code> in the config.</span></div>` : ''}
  </article>`;
}

let data = null;
function render(r) {
  data = r;
  $('#totals').innerHTML = r.accounts.length
    ? tile('Today, all accounts', r.total.today) + tile('Last 7 days', r.total.week) + tile('Last 30 days', r.total.month)
    : '';
  $('#accounts').innerHTML = r.accounts.length
    ? r.accounts.map(cardHTML).join('')
    : `<div class="empty">No accounts found. Run <code>ccmeter init</code> and list your config dirs.</div>`;
  $('#status').innerHTML = `${icon('refresh')}<span>updated ${new Date(r.generated_at).toLocaleTimeString()}</span>`;
}

// ---- tooltip ------------------------------------------------------------
const tip = $('#tip');
document.addEventListener('mouseover', e => {
  const h = e.target.closest('.hit');
  if (!h || !data) return;
  const a = data.accounts[+h.dataset.a], d = a.daily[+h.dataset.i];
  const date = new Date(d.date + 'T00:00:00').toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
  tip.innerHTML = `<div class="muted">${date}</div><b>${usd(d.cost_usd)}</b> <span class="muted">· ${tok(d.tokens)} tokens</span>`;
  const r = h.getBoundingClientRect();
  tip.style.left = (r.left + r.width / 2 + scrollX) + 'px';
  tip.style.top = (r.top + scrollY - 6) + 'px';
  tip.style.display = 'block';
  h.nextElementSibling?.classList.add('on');
});
document.addEventListener('mouseout', e => {
  const h = e.target.closest('.hit');
  if (!h) return;
  tip.style.display = 'none';
  h.nextElementSibling?.classList.remove('on');
});

// ---- polling ------------------------------------------------------------
async function load() {
  try {
    const res = await fetch('/api/summary', { cache: 'no-store' });
    render(await res.json());
  } catch (e) {
    $('#status').innerHTML = `${icon('alert')}<span>can't reach ccmeter</span>`;
  }
}
$('#refresh').onclick = load;
load();
setInterval(load, 15000);
</script>
</body>
</html>
